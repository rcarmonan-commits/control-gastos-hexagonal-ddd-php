services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hexagonal_usuarios_gastos_app
    ports:
      - "8080:80"
    environment:
      APP_ENV: development
      PERSISTENCE_DRIVER: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: crud_usuarios
      DB_USERNAME: Estudiante
      DB_PASSWORD: Developer
      DB_CHARSET: utf8mb4
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: hexagonal_usuarios_gastos_db
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_2026
      MYSQL_DATABASE: crud_usuarios
      MYSQL_USER: Estudiante
      MYSQL_PASSWORD: Developer
    ports:
      - "3307:3306"
    volumes:
      - mysql_hexagonal_data:/var/lib/mysql
      - ./Infrastructure/Adapters/Persistence/MySQL/Database/mysql/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret_2026"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: hexagonal_usuarios_gastos_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_secret_2026
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_hexagonal_data: